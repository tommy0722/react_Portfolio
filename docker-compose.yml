services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "80:80" # 將容器的80端口映射到主機的80端口
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf # 將nginx配置文件掛載到容器中
      # 建置好的靜態檔案已經在 Dockerfile 的 build 階段複製進 image（/frontend/dist），
      # 不需要再掛載本機目錄蓋過去，否則會蓋成空內容。
